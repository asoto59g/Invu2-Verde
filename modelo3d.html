<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Invu 2 Verde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e293b; }
        #canvas-container { width: 100vw; height: calc(100vh - 73px); position: relative; }
        
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1e293b; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50; color: #34d399;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md z-10 relative">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Modelo Tridimensional - INVU 2</h1>
            <nav class="space-x-4">
                <a href="index.html" class="hover:text-emerald-200">Inicio</a>
                <a href="mapa.html" class="hover:text-emerald-200">Mapa</a>
                <a href="modelo3d.html" class="underline font-semibold">Visor 3D</a>
            </nav>
        </div>
    </header>

    <div id="canvas-container">
        <div id="loading-screen">
            <h2 class="text-xl font-bold">Cargando Modelo 3D (Puede tardar minutos)</h2>
            <p id="loading-text" class="text-slate-300 mt-2">Iniciando descarga...</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        const container = document.getElementById('canvas-container');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');

        // 1. Escena básica
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);

        // Luces fuertes
        scene.add(new THREE.AmbientLight(0xffffff, 3.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        // 2. Cargadores (Rutas relativas a modelo3d.html)
        const basePath = './assets/models/';
        console.log("Iniciando carga desde:", basePath);

        const mtlLoader = new MTLLoader();
        mtlLoader.setPath(basePath);
        
        mtlLoader.load('odm_textured_model_geo.mtl', function (materials) {
            console.log("Material (.mtl) cargado con éxito.");
            materials.preload();
            
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            objLoader.setPath(basePath);
            
            objLoader.load('odm_textured_model_geo.obj', function (object) {
                console.log("Objeto (.obj) cargado con éxito.");
                
                scene.add(object);
                
                // MÁGIA DE REPOSICIONAMIENTO
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                console.log("Centro original del objeto:", center);
                console.log("Tamaño del objeto:", size);

                // Forzar el modelo al centro (0,0,0)
                object.position.x = -center.x;
                object.position.y = -center.y;
                object.position.z = -center.z;

                // Calcular dónde poner la cámara basado en el tamaño real
                const maxDim = Math.max(size.x, size.y, size.z);
                
                // Poner la cámara "arriba y atrás"
                camera.position.set(maxDim * 0.5, maxDim * 1.5, maxDim * 1.5);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                loadingScreen.style.display = 'none';

            }, 
            function (xhr) {
                if (xhr.lengthComputable) {
                    const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingText.innerText = `Descargando OBJ: ${percentComplete}% completado.`;
                }
            }, 
            function (error) {
                console.error("Error cargando el .obj:", error);
                loadingText.innerText = "Error cargando el modelo (.obj). Revisa la consola.";
                loadingText.style.color = "red";
            });
            
        }, undefined, function(error) {
            console.error("Error cargando el .mtl:", error);
            loadingText.innerText = "Error cargando archivo de material (.mtl). Revisa la consola.";
            loadingText.style.color = "red";
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
